<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сравнение видеокарт</title>
<style>
:root{--bg:#0f1115;--card:#171b23;--line:#262c38;--txt:#e8ebf2;--mut:#8b93a5;--acc:#4f8cff;--good:#3ecf6e;--bad:#ff5d5d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.filters input,.filters select{background:#0d1017;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;font-size:14px}
.filters input[type=text]{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--acc)}
.card .ph{height:130px;display:flex;align-items:center;justify-content:center;background:#0d1017;border-radius:8px;margin-bottom:10px;overflow:hidden}
.card .ph img{max-width:100%;max-height:130px;object-fit:contain}
.card h3{font-size:15px;margin-bottom:4px;line-height:1.3}
.meta{color:var(--mut);font-size:12px;margin-bottom:8px}
.pbar{height:6px;background:#0d1017;border-radius:4px;overflow:hidden;margin:6px 0 10px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#9b5cff)}
.rowline{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.rowline b{color:var(--txt);font-weight:600}
.cbtns{display:flex;gap:6px;margin-top:10px;align-items:center}
.cbtns label{font-size:12.5px;color:var(--mut);display:flex;gap:4px;align-items:center;cursor:pointer}
.link{background:none;border:none;color:var(--acc);cursor:pointer;font-size:13px;padding:0}
.brand-NVIDIA{color:#76b900}.brand-AMD{color:#ed1c24}.brand-Intel{color:#009fd6}
.topbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;border:none;border-radius:24px;padding:12px 26px;font-size:15px;cursor:pointer;display:none;box-shadow:0 6px 24px rgba(79,140,255,.45);z-index:50}
.cmp{display:none;margin-top:18px}
.cmp h2{font-size:19px;margin-bottom:10px}
.tools{display:flex;gap:14px;align-items:center;margin-bottom:10px;color:var(--mut);font-size:13.5px;flex-wrap:wrap}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:720px}
th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
th{background:#12151d;color:var(--mut);font-weight:600;position:sticky;top:0}
th .cp{font-size:12px;color:var(--mut);font-weight:400}
td.sec,th.sec{background:#12151d;color:var(--txt);font-weight:700;font-size:13px;letter-spacing:.4px}
.good{color:var(--good);font-weight:600}.bad{color:var(--bad)}
.tdl{color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:100;overflow-y:auto}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;padding:20px}
.mbox h2{font-size:19px;margin-bottom:2px}
.mbox .img{height:300px;background:#0d1017;border-radius:10px;margin:12px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mbox .img img{max-width:100%;max-height:300px;object-fit:contain}
.phc{font-size:11.5px;color:var(--mut);text-align:right;margin-top:3px}
.msec{margin-top:14px}
.msec h4{font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.mrow{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0;font-size:13.5px}
.mrow span{color:var(--mut)}.mrow b{font-weight:600;text-align:right}
.close{float:right;background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer}
.count{color:var(--mut);font-size:13px}
.back{margin-top:14px}
@media(max-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.card .ph{height:100px}.card .ph img{max-height:100px}}

.pmgr{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
.pbtn{display:inline-block;padding:7px 14px;border:1px solid #3a4356;border-radius:8px;background:#1a2130;color:#cfd6e4;font-size:13px;cursor:pointer;user-select:none}
.pbtn:hover{background:#232c3e}
.pbtn.warn{color:#ff9d9d;border-color:#5a3038}
.pbtn.warn:hover{background:#3a2026}
.imgwrap{position:relative}
.garr{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:30px;height:30px;font-size:18px;line-height:1;cursor:pointer;z-index:2}
.garr:hover{background:rgba(0,0,0,.8)}
.garr.left{left:6px}
.garr.right{right:6px}
.gcnt{color:#8fd18f;font-weight:600}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.thumb{position:relative;width:64px;height:48px;border:2px solid #262c38;border-radius:6px;overflow:hidden;cursor:pointer;flex:0 0 auto}
.thumb:hover{border-color:#4f8cff}
.thumb.cur{border-color:#4f8cff}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tx{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:4px;font-size:10px;line-height:1;padding:2px 4px;cursor:pointer;z-index:2}
.tx:hover{background:rgba(180,40,40,.9)}
.pbtn.dim{opacity:.6;cursor:default}
.phc.custom{color:#9be29b}

/* === Где купить === */
.shoprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.shopb{display:inline-block;padding:9px 14px;border-radius:8px;background:#1f6feb;color:#fff;text-decoration:none;font-weight:600;font-size:13px;border:none;cursor:pointer}
.shopb:hover{background:#3a8bff}
.bnote{font-size:11px;opacity:.6;margin-top:7px}
/* === Лайтбокс с зумом === */
#zbox{position:fixed;inset:0;background:rgba(6,8,12,.95);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column}
#zimg{max-width:92vw;max-height:82vh;transform-origin:center center;cursor:grab;will-change:transform}
#zimg.grab{cursor:grabbing}
.zpanel{position:absolute;top:12px;right:12px;display:flex;gap:6px;align-items:center;background:rgba(22,26,34,.92);padding:6px 10px;border-radius:10px}
.zpanel button{background:#2b3240;color:#fff;border:none;border-radius:6px;padding:6px 11px;cursor:pointer;font-size:13px}
.zpanel button:hover{background:#3d465a}
.zpanel span{color:#fff;font-size:13px;min-width:46px;text-align:center}
.zhint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:#9aa3b2;font-size:12px;background:rgba(22,26,34,.88);padding:6px 12px;border-radius:8px;white-space:nowrap}
</style></head><body>
<div class="wrap">
<h1>Сравнение видеокарт</h1>
<div class="sub">База характеристик: 194 модели за 20 лет (2005–2025)</div>
<div class="filters">
<input type="text" id="q" placeholder="Поиск: RTX 4070, Navi 31, RDNA...">
<select id="fBrand"><option value="">Все бренды</option><option>NVIDIA</option><option>AMD</option><option>Intel</option></select>
<select id="fClass"><option value="">Все классы</option><option>Начальная</option><option>Средняя</option><option>Производительная</option><option>Флагман</option></select>
<select id="fMem"><option value="">VRAM: любая</option><option value="2">от 2 ГБ</option><option value="4">от 4 ГБ</option><option value="6">от 6 ГБ</option><option value="8">от 8 ГБ</option><option value="10">от 10 ГБ</option><option value="12">от 12 ГБ</option><option value="16">от 16 ГБ</option></select>
<select id="fYear"><option value="">Год: любой</option><option value="2010">от 2010</option><option value="2014">от 2014</option><option value="2016">от 2016</option><option value="2018">от 2018</option><option value="2020">от 2020</option><option value="2022">от 2022</option><option value="2023">от 2023</option><option value="2024">от 2024</option><option value="2025">от 2025</option></select>
<label><input type="checkbox" id="fRay"> только с трассировкой</label>
<select id="sort"><option value="perf">По производительности</option><option value="-year">По году (новые)</option><option value="year">По году (старые)</option><option value="boost">По Boost-частоте</option><option value="bw">По пропускной способности</option><option value="mem">По объёму памяти</option><option value="tgp">По энергопотреблению (возр.)</option><option value="name">По названию</option></select>
<span class="count" id="cnt"></span>
</div>
<div class="grid" id="grid"></div>
<button class="topbar" id="cmpBtn"></button>
<div class="cmp" id="cmp"></div>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<div id="zbox" style="display:none">
  <div class="zpanel">
    <button id="zminus" title="Уменьшить">−</button><span id="zpct">100%</span><button id="zplus" title="Увеличить">+</button>
    <button id="zreset">Сброс</button><button id="zclose">✕ Закрыть</button>
  </div>
  <img id="zimg" alt="Просмотр фото">
  <div class="zhint">Колесо — масштаб · перетаскивание — просмотр · двойной клик — 300% · Esc — выход</div>
</div>

function fmtMem(g){ return g>=1? g+' ГБ' : Math.round(g*1024)+' МБ'; }

  const k = Object.keys(PH).find(k => c.name.endsWith(k) || (' '+c.name+' ').includes(' '+k+' '));

  return FP + encodeURIComponent(PH[k]) + (w ? '?width=' + w : '');
}

const PHMAX = 5;
function pkey(n,i){ return 'gp_ph::'+n+'::'+i; }
function pold(n){ return 'gp_ph::'+n; }
function customPhotos(n){
  const out = [];
  try{
    for(let i=0;i<PHMAX;i++){ const v = localStorage.getItem(pkey(n,i)); if(v) out.push(v); }
    if(!out.length){ const v = localStorage.getItem(pold(n)); if(v) out.push(v); }
  }catch(e){}
  return out;
}
function migratePhoto(n){
  try{
    const v = localStorage.getItem(pold(n));

      '<div class="rowline"><span>Boost</span><b>'+(c.boost? c.boost+' МГц':'—')+'</b></div>'+
      '<div class="rowline"><span>TGP</span><b>'+c.tgp+' Вт</b></div>'+
      '<div class="cbtns"><button class="link" onclick="event.stopPropagation();detail(this.closest(\'.card\').dataset.name)">Подробнее</button>'+
      '<button class="link" onclick="event.stopPropagation();buySearch(this.closest(\'.card\').dataset.name)">₽ Цены</button><span style="flex:1"></span><label><input type="checkbox" class="cbx" '+(checked?'checked':'')+' onclick="event.stopPropagation();toggleSel(\''+esc(c.name)+'\',this)"> сравнить</label></div>'+
    '</div>';
  }).join('');
  g.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', e=>{ if(e.target.type==='checkbox') return; detail(el.dataset.name); });
  });
}
function toggleSel(name, cb){
  if(cb.checked) sel.add(name); else sel.delete(name);
  if(sel.size>4){ sel.delete(name); cb.checked=false; alert('Не больше 4 карт'); return; }
  const b = document.getElementById('cmpBtn');
  b.style.display = sel.size>=2 ? 'block':'none';
  b.textContent = 'Сравнить ('+sel.size+')';
}
function cmpOpenFn(){
  const list = [...sel].map(n=>DATA.find(c=>c.name===n));
  cmpOpen = true;
  const c = document.getElementById('cmp');
  c.style.display='block';
  const onlyDiffs = document.getElementById('onlyD') && document.getElementById('onlyD').checked;
  let body='';
  for(const [title, rows] of SECS){
    const visible = rows.filter(r=>{
      if(!onlyDiffs) return true;
      if(r[2]===undefined) return true;
      const vals = list.map(c=>c[r[2]]);
      if(r[2]==='mem' || r[2]==='perf') return vals.some(v=>v!==vals[0]) || new Set(list.map(c=>c[r[2]]==='mem'? c.mem : c.perf)).size>1;
      return new Set(vals).size>1;
    });
    if(!visible.length && onlyDiffs) continue;
    if(visible.length===0) continue;
    body += '<tr><td class="sec" colspan="'+(list.length+1)+'">'+title+'</td></tr>';
    for(const r of visible){
      let tds='';
      for(const cc of list){
        let clsT='';
        if(r[3]){ // числовое
          const nums = list.map(x=>x[r[2]]);
          if(new Set(nums).size>1){
            if(r[4]){ if(cc[r[2]]===Math.min(...nums)) clsT='good'; else if(cc[r[2]]===Math.max(...nums)) clsT='bad'; }
            else { if(cc[r[2]]===Math.max(...nums)) clsT='good'; else if(cc[r[2]]===Math.min(...nums)) clsT='bad'; }
          }
        }
        tds += '<td class="'+clsT+'">'+r[1](cc)+'</td>';
      }
      body += '<tr><td class="tdl">'+r[0]+'</td>'+tds+'</tr>';
    }
  }
  let header = list.map(cc=>'<th><div style="max-width:150px">'+phHTML(cc,false)+'</div><div class="brand-'+cc.brand+'" style="margin-top:6px">'+esc(cc.name)+'</div><div class="cp">'+cls(cc)+'</div></th>').join('');
  const shown = body.split('<tr><td class="sec"').length-1;
  c.innerHTML = '<h2>Сравнение</h2>'+
    '<div class="tools"><label><input type="checkbox" id="onlyD" '+(onlyDiffs?'checked':'')+' onchange="cmpOpenFn()"> показать только отличающиеся параметры</label>'+
    '<span id="diffCnt">Отличий: '+countDiffs(list)+'</span>'+
    '<button class="link" onclick="clearCmp()">✕ закрыть сравнение</button></div>'+
    '<div class="tw"><table><tr><th>Параметр</th>'+header+'</tr>'+body+'</table></div>'+
    '<button class="link back" onclick="window.scrollTo({top:0,behavior:\'smooth\'})">↑ К списку карт</button>';
  c.scrollIntoView({behavior:'smooth'});
}
function countDiffs(list){
  let n=0;
  for(const [,rows] of SECS) for(const r of rows){ if(r[2]===undefined) continue; const vals=list.map(c=>c[r[2]]); if(new Set(vals).size>1) n++; }
  return n;
}
function clearCmp(){
  cmpOpen=false; sel.clear();
  document.getElementById('cmpBtn').style.display='none';
  document.getElementById('cmp').style.display='none';
  document.querySelectorAll('.cbx').forEach(cb=>cb.checked=false);
  window.scrollTo({top:0,behavior:'smooth'});
}
function detail(name){
  curDetailName = name;
  migratePhoto(name);
  const c = DATA.find(x=>x.name===name);
  const k = phKeyOf(c);
  const u = photoUrl(c, 1280) || autoGet(name);
  const ph = customPhotos(name);
  if(!u && !ph.length) autoFetch(c, function(){ if(curDetailName === name) detail(name); });
  const slides = ph.map(function(src,i){ return {src:src, cap:'Ваше фото '+(i+1)+' из '+ph.length+' — сохранено в этом браузере', own:true}; });
  if(u) slides.push({src:u, cap:(k ? 'Фото: '+esc(PH[k])+' (Wikimedia Commons)' : 'Фото: Wikimedia Commons'), own:false});
  if(galName !== name){ galName = name; galCur = 0; }
  if(galCur >= slides.length) galCur = Math.max(0, slides.length-1);
  const s = slides.length ? slides[galCur] : null;
  let big;
  if(s){
    let imgTag = '<img src="'+s.src+'" alt="'+esc(c.name)+'" style="max-width:100%;object-fit:contain;cursor:zoom-in" onclick="zoomOpen(this.src)"';
    imgTag += s.own ? '>' : ' onerror="imgFail(this,'+JSON.stringify(c.name).replace(/"/g,'&quot;')+')">';
    big = '<div class="img imgwrap">'+imgTag;
    if(slides.length > 1){
      big += '<button class="garr left" onclick="galGo('+(galCur===0?slides.length-1:galCur-1)+')">‹</button>'
           + '<button class="garr right" onclick="galGo('+(galCur===slides.length-1?0:galCur+1)+')">›</button>';
    }
    big += '</div>';
  } else {
    big = '<div class="img">'+phHTML(c,true)+'</div>';
  }
  const cap = s
    ? '<div class="phc'+(s.own?' custom':'')+'">'+(slides.length>1?'<span class="gcnt">'+(galCur+1)+' / '+slides.length+'</span> &nbsp; ':'')+s.cap+'</div>'
    : '<div class="phc">Фотографий нет — можно добавить до '+PHMAX+' своих</div>';
  let thumbs = '';
  if(slides.length){
    thumbs = '<div class="thumbs">'+slides.map(function(sl,i){
      const del = sl.own ? '<button class="tx" onclick="event.stopPropagation();delPhoto('+i+')">✕</button>' : '';
      const err = sl.own ? '' : ' onerror="this.parentNode.style.display=\'none\'"';
      return '<div class="thumb'+(i===galCur?' cur':'')+'" onclick="galGo('+i+')">'+del+'<img src="'+sl.src+'" alt=""'+err+'></div>';
    }).join('')+'</div>';
  }
  const left = PHMAX - ph.length;
  const pmgr = '<div class="pmgr">'
    + (left > 0
        ? '<label class="pbtn"><input type="file" accept="image/*" multiple style="display:none" onchange="photoPick(this)">📷 Добавить фото'+(ph.length?' — ещё '+left+' (из '+PHMAX+')':' (до '+PHMAX+')')+'</label>'
        : '<span class="pbtn dim">Лимит — '+PHMAX+' фото достигнут</span>')
    + (ph.length ? '<button class="pbtn warn" onclick="delAll()">Убрать все мои ('+ph.length+')</button>' : '')
    + '</div>';
  let secs='';
  for(const [title, rows] of SECS){
    secs += '<div class="msec"><h4>'+title+'</h4>'+rows.map(r=>'<div class="mrow"><span>'+r[0]+'</span><b>'+r[1](c)+'</b></div>').join('')+'</div>';
  }
  document.getElementById('mbox').innerHTML = '<button class="close" onclick="closeModal()">✕</button><h2 class="brand-'+c.brand+'">'+esc(c.name)+'</h2><div class="meta">'+cls(c)+' · '+c.year+'</div>'+big+cap+thumbs+pmgr+secs+buyHTML(c);
  document.getElementById('modal').style.display='flex';
}
function closeModal(){ document.getElementById('modal').style.display='none'; }
function photoPick(inp){
  if(!curDetailName) return;
  const files = Array.prototype.slice.call(inp.files || []);
  inp.value = '';
  if(!files.length) return;
  let free = [];
  try{
    for(let i=0;i<PHMAX;i++){ if(!localStorage.getItem(pkey(curDetailName,i))) free.push(i); }
  }catch(e){}
  if(!free.length){ alert('Лимит — '+PHMAX+' фото на карточку. Сначала удалите лишнее крестиком на миниатюре.'); return; }
  const todo = files.slice(0, free.length);
  if(todo.length < files.length) alert('Добавлю только '+todo.length+' из '+files.length+' фото: лимит — '+PHMAX+'.');
  let saved = 0;
  function next(idx){
    if(idx >= todo.length){
      if(saved){ detail(curDetailName); render(); }
      else alert('Не удалось сохранить фото: хранилище браузера заполнено. Попробуйте файл поменьше или удалите лишние.');
      return;
    }
    const f = todo[idx];
    const r = new FileReader();
    r.onload = function(){
      const im = new Image();
      im.onload = function(){
        const mx = 900;
        let w = im.width, h = im.height;
        if(Math.max(w,h)>mx){ const k2 = mx/Math.max(w,h); w = Math.round(w*k2); h = Math.round(h*k2); }
        let out;
        try{
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(im, 0, 0, w, h);
          out = cv.toDataURL('image/jpeg', 0.82);
        }catch(e){ out = r.result; }
        try{ localStorage.setItem(pkey(curDetailName, free[idx]), out); saved++; }
        catch(e){ /* хранилище заполнено — слот пропускаем */ }
        next(idx+1);
      };
      im.onerror = function(){ next(idx+1); };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  }
  next(0);
}
function galGo(i){
  galCur = i;
  if(galName) detail(galName);
}
function delPhoto(i){
  if(!curDetailName) return;
  try{ localStorage.removeItem(pkey(curDetailName,i)); }catch(e){}
  const c = DATA.find(x=>x.name===curDetailName);
  const total = customPhotos(curDetailName).length + (photoUrl(c) ? 1 : 0);
  if(galCur >= total) galCur = Math.max(0, total-1);
  detail(curDetailName);
  render();
}
function delAll(){
  if(!curDetailName) return;
  if(!confirm('Убрать все ваши фото этой карточки?')) return;
  try{
    for(let i=0;i<PHMAX;i++) localStorage.removeItem(pkey(curDetailName,i));
    localStorage.removeItem(pold(curDetailName));
  }catch(e){}
  galCur = 0;
  detail(curDetailName);
  render();
}

document.getElementById('cmpBtn').addEventListener('click', cmpOpenFn);

// ===== ГДЕ КУПИТЬ: ПАРТНЁРСКИЕ МАГАЗИНЫ =====
// Чтобы кнопки стали партнёрскими: зарегистрируйтесь в Admitad как вебмастер,
// получите свой партнёрский параметр и впишите его в поле aff нужного магазина,
// например: aff:'subid=ВАШ_ТЕГ'. Пустое aff — кнопки работают как обычные ссылки.
const SHOPS = [
  { t:'ДНС',         u:'https://www.dns-shop.ru/search/?q={Q}',       aff:'' },
  { t:'Ситилинк',    u:'https://www.citilink.ru/search/?text={Q}',    aff:'' },
  { t:'Ozon',        u:'https://www.ozon.ru/search/?text={Q}',        aff:'' },
  { t:'Wildberries', u:'https://www.wildberries.ru/search?query={Q}', aff:'' },
  { t:'Я.Маркет',    u:'https://market.yandex.ru/search?text={Q}',    aff:'' }
];
function shopUrl(s, name){
  let u = s.u.replace('{Q}', encodeURIComponent(name));
  if(s.aff) u += (u.indexOf('?') >= 0 ? '&' : '?') + s.aff;
  return u;
}
function buyHTML(c){
  const btns = SHOPS.map(function(s){
    return '<a class="shopb" target="_blank" rel="noopener" href="' + shopUrl(s, c.name) + '">' + s.t + '</a>';
  }).join('');
  return '<div class="msec buy"><h4>Где купить</h4><div class="shoprow">' + btns + '</div><div class="bnote">Поиск по точному названию модели</div></div>';
}
function buySearch(name){
  window.open(shopUrl(SHOPS[0], name), '_blank');
}

// ===== АВТОПОДБОР ФОТО С WIKIMEDIA COMMONS =====
function autoKey(n){ return 'gp_auto::' + n; }
function autoGet(n){ try{ return localStorage.getItem(autoKey(n)) || ''; } catch(e){ return ''; } }
function autoSet(n, url){ try{ localStorage.setItem(autoKey(n), url); } catch(e){} }
const autoPending = {};
const autoQueue = [];
let autoActive = 0;
const AUTO_MAX = 3;
function autoBadTitle(t){
  return /(diagram|schemat|block_diagram|pinout|logo|chart|table|infobox|die ?shot|front side|side view|back side)/i.test(t);
}
function autoFetch(c, done){
  const name = c.name;
  if(autoPending[name]){ if(done) done(); return; }
  autoPending[name] = true;
  const queries = [name + ' graphics card', name + ' GPU', name + ' video card'];
  let qi = 0;
  function finish(){ if(done) done(); }
  function tryQuery(){
    if(qi >= queries.length){ finish(); return; }
    const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrsearch='
      + encodeURIComponent('filetype:bitmap ' + queries[qi++])
      + '&gsrlimit=10&prop=imageinfo&iiprop=url|size&iiurlwidth=640';
    fetch(url).then(function(r){ return r.json(); }).then(function(j){
      const pages = (j && j.query && j.query.pages)
        ? Object.keys(j.query.pages).map(function(k){ return j.query.pages[k]; }) : [];
      const good = pages.filter(function(p){
        if(!p.imageinfo || !p.imageinfo.length) return false;
        const ii = p.imageinfo[0];
        if(!/\.(jpe?g|png)$/i.test(p.title || '')) return false;
        if(autoBadTitle(p.title || '')) return false;
        return (ii.width || 0) >= 400;
      });
      if(good.length){
        const pick = good[0].imageinfo[0].thumburl || good[0].imageinfo[0].url;
        autoSet(name, pick);
        updateCardPhoto(name, pick);
        finish();
      } else tryQuery();
    }).catch(function(){ tryQuery(); });
  }
  tryQuery();
}
function updateCardPhoto(name, url){
  const tile = document.querySelector('.card[data-name="' + CSS.escape(name) + '"] .ph');
  if(tile) tile.innerHTML = '<img loading="lazy" src="' + url + '" alt="' + esc(name) + '">';
  if(curDetailName === name) detail(name);
}
const autoQueueCards = [];
function bootAuto(){
  DATA.forEach(function(c){
    if(photoUrl(c)) return;
    if(customPhotos(c.name).length) return;
    if(autoGet(c.name)) return;
    autoQueueCards.push(c);
  });
  pumpAuto();
}
function pumpAuto(){
  while(autoActive < 3 && autoQueueCards.length){
    const c = autoQueueCards.shift();
    autoActive++;
    autoFetch(c, function(){ autoActive--; pumpAuto(); });
  }
}

// ===== ЛАЙТБОКС С ЗУМОМ =====
let zScale = 1, zX = 0, zY = 0, zDrag = false, zSX = 0, zSY = 0, zBX = 0, zBY = 0;
function zoomApply(){
  document.getElementById('zimg').style.transform = 'translate(' + zX + 'px,' + zY + 'px) scale(' + zScale + ')';
  document.getElementById('zpct').textContent = Math.round(zScale * 100) + '%';
}
function zoomReset(){ zScale = 1; zX = 0; zY = 0; zoomApply(); }
function zoomOpen(src){ document.getElementById('zimg').src = src; document.getElementById('zbox').style.display = 'flex'; zoomReset(); }
function zoomClose(){ document.getElementById('zbox').style.display = 'none'; }
function zoomMul(m, cx, cy){
  const old = zScale;
  zScale = Math.min(10, Math.max(1, zScale * m));
  if(zScale === old) return;
  if(cx !== undefined){
    const r = document.getElementById('zimg').getBoundingClientRect();
    const ox = cx - (r.left + r.width / 2), oy = cy - (r.top + r.height / 2);
    const k = zScale / old;
    zX = (zX - ox) * k + ox;
    zY = (zY - oy) * k + oy;
  }
  zoomApply();
}
(function(){
  const box = document.getElementById('zbox');
  const img = document.getElementById('zimg');
  document.getElementById('zminus').onclick = function(){ zoomMul(1 / 1.15); };
  document.getElementById('zplus').onclick = function(){ zoomMul(1.15); };
  document.getElementById('zreset').onclick = zoomReset;
  document.getElementById('zclose').onclick = zoomClose;
  box.addEventListener('click', function(e){ if(e.target === box) zoomClose(); });
  box.addEventListener('wheel', function(e){
    e.preventDefault();
    zoomMul(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY);
  }, { passive: false });
  box.addEventListener('dblclick', function(e){
    if(e.target === img) zoomMul(zScale < 3 ? 3 : 1 / 3, e.clientX, e.clientY);
  });
  img.addEventListener('pointerdown', function(e){
    zDrag = true; zSX = e.clientX; zSY = e.clientY; zBX = zX; zBY = zY;
    img.setPointerCapture(e.pointerId);
    img.classList.add('grab');
  });
  img.addEventListener('pointermove', function(e){
    if(!zDrag) return;
    zX = zBX + (e.clientX - zSX);
    zY = zBY + (e.clientY - zSY);
    zoomApply();
  });
  function drop(){ zDrag = false; img.classList.remove('grab'); }
  img.addEventListener('pointerup', drop);
  img.addEventListener('pointercancel', drop);
  document.addEventListener('keydown', function(e){
    if(document.getElementById('zbox').style.display !== 'flex') return;
    if(e.key === 'Escape') zoomClose();
    if(e.key === '+' || e.key === '=') zoomMul(1.15);
    if(e.key === '-') zoomMul(1 / 1.15);
    if(e.key === '0') zoomReset();
  });
  if(document.readyState === 'complete') bootAuto();
  else window.addEventListener('load', bootAuto);
})();
